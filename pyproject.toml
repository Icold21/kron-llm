[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kronllm"
version = "2.0.0"
description = "A compact, fully Kronecker-parameterised language model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ivan Kholodilo" }]
keywords = ["language-model", "kronecker", "parameter-efficiency", "small-language-model", "pytorch"]
classifiers = [
    "MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "datasets>=2.18",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dashboard = ["gradio>=4.0"]
hf = ["transformers>=4.40"]
dev = ["pytest>=7.4", "ruff>=0.5", "jupyter>=1.0"]

[project.urls]
Homepage = "https://github.com/Icold21/kron-llm"
Repository = "https://github.com/Icold21/kron-llm"
Issues = "https://github.com/Icold21/kron-llm/issues"

[project.scripts]
kronllm = "kronllm.cli:main"

[tool.setuptools.packages.find]
include = ["kronllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running integration tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
